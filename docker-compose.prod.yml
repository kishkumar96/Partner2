services:
  partner2:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_ENABLE_PARTNER_API: "true"
        NEXT_PUBLIC_PARTNER_API_COUNTRIES: "VU,WS,TO,CK"
        NEXT_PUBLIC_PARTNER_API_STRICT_COUNTRIES: "VU"
        NEXT_PUBLIC_BASE_PATH: "/partner2"
    container_name: partner2-dashboard
    ports:
      - "3112:3112"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3112
      HOSTNAME: 0.0.0.0
      AUTH_REQUIRE_REDIS: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3112/partner2 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
