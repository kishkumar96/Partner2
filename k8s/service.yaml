apiVersion: v1
kind: Service
metadata:
  name: climate-dashboard
  namespace: production
  labels:
    app: climate-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: climate-dashboard
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: climate-dashboard-headless
  namespace: production
  labels:
    app: climate-dashboard
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: climate-dashboard
