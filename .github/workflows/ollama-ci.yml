name: Ollama AI Tasks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  # Only run if Ollama integration is desired
  # Requires self-hosted runner with Ollama installed
  # Comment out this workflow if not using self-hosted runners
  
  ai-code-review:
    name: AI Code Review
    runs-on: self-hosted  # Use self-hosted runner with Ollama
    # For GitHub hosted runners (limited RAM):
    # runs-on: ubuntu-latest
    
    # Only run on PRs with 'ai-review' label
    if: contains(github.event.pull_request.labels.*.name, 'ai-review')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      
      # For GitHub-hosted runners (uncomment if needed)
      # - name: Install Ollama
      #   run: |
      #     curl -fsSL https://ollama.com/install.sh | sh
      
      # For GitHub-hosted runners (uncomment if needed)
      # - name: Start Ollama
      #   run: |
      #     ollama serve &
      #     sleep 10
      
      # For GitHub-hosted runners (uncomment if needed)
      # - name: Pull Model
      #   run: |
      #     ollama pull codellama:7b
      
      - name: Check Ollama Status
        run: |
          if ! curl -s http://localhost:11434/api/tags > /dev/null; then
            echo "⚠️ Ollama is not running. Skipping AI review."
            exit 0
          fi
          echo "✅ Ollama is available"
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run AI Code Review
        id: review
        continue-on-error: true
        run: |
          node scripts/ollama-review.js
        env:
          OLLAMA_HOST: http://localhost:11434
          OLLAMA_MODEL: codellama:7b
      
      - name: Read Review Results
        if: steps.review.outcome == 'success'
        id: read_review
        run: |
          if [ -f ollama-review.md ]; then
            # Escape content for GitHub Actions
            echo "REVIEW_CONTENT<<EOF" >> $GITHUB_ENV
            cat ollama-review.md >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
      
      - name: Comment PR with Review
        if: steps.review.outcome == 'success' && env.REVIEW_CONTENT != ''
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = process.env.REVIEW_CONTENT;
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🤖 AI Code Review')
            );
            
            const commentBody = `${review}
            
            ---
            
            <sub>🤖 Generated by Ollama | Model: \`codellama:7b\` | [Learn more](docs/OLLAMA_INTEGRATION.md)</sub>`;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
      
      - name: Upload Review Artifact
        if: steps.review.outcome == 'success'
        uses: actions/upload-artifact@v3
        with:
          name: ai-code-review
          path: ollama-review.md
          retention-days: 30
      
      - name: Review Failed
        if: steps.review.outcome == 'failure'
        run: |
          echo "⚠️ AI code review failed. Check logs for details."
          echo "This is non-blocking - the PR can still be merged."

  # Optional: Generate documentation  
  ai-docs:
    name: AI Documentation Check
    runs-on: self-hosted
    if: contains(github.event.pull_request.labels.*.name, 'needs-docs')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Check Documentation Coverage
        run: |
          echo "🔍 Checking documentation coverage..."
          # Add your documentation check logic here
          # This is a placeholder for future implementation
