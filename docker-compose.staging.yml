version: '3.8'

services:
  # PostgreSQL with PostGIS - Staging
  postgres-staging:
    image: postgis/postgis:15-3.3
    container_name: climate-postgres-staging
    environment:
      POSTGRES_DB: climate_risk_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_STAGING:-staging_secure_2026}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
      - ./scripts/db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - staging-network

  # Redis - Staging
  redis-staging:
    image: redis:7-alpine
    container_name: climate-redis-staging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD_STAGING:-staging_redis_secure_2026}
    volumes:
      - redisdata-staging:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - staging-network

  # pg_tileserv - Staging
  tileserver-staging:
    image: pramsey/pg_tileserv:latest
    container_name: climate-tileserver-staging
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD_STAGING:-staging_secure_2026}@postgres-staging:5432/climate_risk_staging
      TS_BASEPATH: /tiles
    ports:
      - "7801:7800"
    depends_on:
      postgres-staging:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - staging-network

  # Next.js Application - Staging
  partner2-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: partner2-staging
    ports:
      - "3113:3113"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ENVIRONMENT=staging
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD_STAGING:-staging_secure_2026}@postgres-staging:5432/climate_risk_staging
      - REDIS_URL=redis://:${REDIS_PASSWORD_STAGING:-staging_redis_secure_2026}@redis-staging:6379
      - TILESERVER_URL=http://tileserver-staging:7800
      - NEXT_PUBLIC_TILESERVER_URL=http://localhost:7801
    # Mount code for hot-reload without rebuilds
    volumes:
      - .:/app
      - partner2_staging_node_modules:/app/node_modules
      - partner2_staging_next_cache:/app/.next
    # Override CMD to support mounted code
    entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint.sh"]
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - staging-network

volumes:
  pgdata-staging:
    driver: local
  redisdata-staging:
    driver: local
  partner2_staging_node_modules:
  partner2_staging_next_cache:

networks:
  staging-network:
    driver: bridge
