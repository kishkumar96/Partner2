version: '3.8'

services:
  partner2:
    build: .
    container_name: partner2-dashboard
    ports:
      - "3112:3112"
    environment:
      - NODE_ENV=production
      - PORT=3112
      - HOSTNAME=0.0.0.0
      # Copy .env.example → .env.production and update these values before deploying
      - NEXT_PUBLIC_APP_URL=http://localhost:3112/partner2
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
