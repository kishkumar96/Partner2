services:
  partner2:
    build: .
    container_name: partner2-dashboard
    ports:
      - "3112:3112"
    # Copy .env.example → .env.production and update values before deploying
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3112
      HOSTNAME: 0.0.0.0
      AUTH_REQUIRE_REDIS: "false"
    # Mount code for hot-reload without rebuilds
    volumes:
      - .:/app
      - partner2_prod_node_modules:/app/node_modules
      - partner2_prod_next_cache:/app/.next
    # Override CMD to support mounted code
    entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint.sh"]
    restart: unless-stopped
    networks:
      - app-network

  partner2-dev:
    image: node:20-alpine
    container_name: partner2-dashboard-dev
    working_dir: /app
    ports:
      - "3002:3002"
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      PORT: 3002
      HOSTNAME: 0.0.0.0
      AUTH_REQUIRE_REDIS: "false"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - partner2_node_modules:/app/node_modules
      - partner2_next_cache:/app/.next
    command: >
      sh -c "npm ci && npx next dev --hostname 0.0.0.0 --port 3002"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  partner2_node_modules:
  partner2_next_cache:
  partner2_prod_node_modules:
  partner2_prod_next_cache:
